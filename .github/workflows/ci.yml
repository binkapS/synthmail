name: CI
on:
  push: { branches: ["main", "master"] }
  pull_request:
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --check
      # Workspace-wide clippy with warnings denied (audit M-18). pipefail so
      # the step fails when cargo fails even if output is truncated.
      - name: clippy (workspace)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | head -n 200
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - name: test (workspace)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tail -n 100
  migrate_check:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgres:16-alpine, env: { POSTGRES_PASSWORD: test }, ports: ["5432:5432"], options: --health-cmd="pg_isready" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
      # Actually run migrations against the service Postgres (audit M-18);
      # failures fail the job.
      - name: run migrations
        env: { DATABASE_URL: "postgres://postgres:test@localhost:5432/postgres" }
        run: sqlx migrate run --source crates/synth-control/migrations
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { target: ["linux/amd64", "linux/arm64"] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform ${{ matrix.target }} -f docker/synth-control/Dockerfile --push=false .
      - run: docker buildx build --platform ${{ matrix.target }} -f docker/synth-webmail/Dockerfile --push=false .
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - name: start postgres and redis
        run: docker compose up -d postgres redis
      - name: wait and inspect
        run: |
          sleep 8
          docker compose ps
      - name: healthz smoke (best effort)
        run: |
          set -o pipefail
          # App health endpoints only answer when the full stack is up;
          # curl failures here are reported but do not fail the job until
          # the stack is started in CI (audit M-18, best effort).
          for url in http://127.0.0.1:8000/healthz http://127.0.0.1:3000/healthz; do
            if curl -fsS --max-time 5 "$url" 2>/dev/null; then
              echo "OK: $url"
            else
              echo "WARN: $url unreachable (full stack not started in smoke; postgres/redis only)"
            fi
          done
      - run: docker compose logs --tail=50
      - run: docker compose down -v || true

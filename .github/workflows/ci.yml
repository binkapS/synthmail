name: CI
on:
  push: { branches: ["main", "master"] }
  pull_request:

# Pin the toolchain so clippy/rustfmt drift never silently changes what the
# lint gate enforces (audit B-02). Bump deliberately; `cargo fmt --check`
# and `cargo clippy -- -D warnings` must pass on the pinned version before
# the bump lands.
env:
  RUST_PIN: "1.99.1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v0
        with: { toolchain: ${{ env.RUST_PIN }}, components: rustfmt, clippy }
      - run: cargo fmt --check
      # Workspace-wide clippy with warnings denied (audit M-18). The step
      # must fail when cargo fails and the *error lines* must stay visible
      # in the log (audit B-02): no truncating the output that explains
      # why the build broke.
      - name: clippy (workspace)
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v0
        with: { toolchain: ${{ env.RUST_PIN }}, components: clippy }
      - name: test (workspace)
        shell: bash
        run: cargo test --workspace

  # Audit L-04: dependency advisories. `cargo audit` checks `Cargo.lock`
  # against the RustSec advisory DB; `npm audit` does the same for the
  # UI's lockfile. Both fail the job on a known-vulnerable dependency.
  audit-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustsec audit (Cargo.lock)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit (ui/package-lock.json)
        run: npm audit --prefix ui
  migrate_check:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgres:16-alpine, env: { POSTGRES_PASSWORD: test }, ports: ["5432:5432"], options: --health-cmd="pg_isready" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v0
        with: { toolchain: ${{ env.RUST_PIN }}, components: clippy }
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
      # Actually run migrations against the service Postgres (audit M-18);
      # failures fail the job.
      - name: run migrations
        env: { DATABASE_URL: "postgres://postgres:test@localhost:5432/postgres" }
        run: sqlx migrate run --source crates/synth-control/migrations
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { target: ["linux/amd64", "linux/arm64"] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform ${{ matrix.target }} -f docker/synth-control/Dockerfile --push=false .
      - run: docker buildx build --platform ${{ matrix.target }} -f docker/synth-webmail/Dockerfile --push=false .
      - run: docker buildx build --platform ${{ matrix.target }} -f docker/synth-smtp/Dockerfile --push=false .
      - run: docker buildx build --platform ${{ matrix.target }} -f docker/synth-ui/Dockerfile --push=false .
  config-test:
    # Audit N-07: validate mail configs the way the daemons would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: postfix check
        run: |
          docker run --rm -v "$PWD/docker/postfix/main.cf:/etc/postfix/main.cf:ro" \
            -v "$PWD/docker/postfix/master.cf:/etc/postfix/master.cf:ro" \
            debian:bookworm-slim sh -c \
            'apt-get update >/dev/null && apt-get install -y --no-install-recommends postfix postfix-pgsql >/dev/null && postfix check /etc/postfix/main.cf /etc/postfix/master.cf'
      - name: rspamd configtest
        run: |
          docker run --rm -v "$PWD/docker/rspamd/local.d:/etc/rspamd/local.d:ro" \
            rspamd/rspamd:3.6.0 rspamadm configtest
      - name: doveconf sanity
        run: |
          docker run --rm -v "$PWD/docker/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro" \
            debian:bookworm-slim sh -c \
            'apt-get update >/dev/null && apt-get install -y --no-install-recommends dovecot-core >/dev/null && doveconf -n | head -5'
  ui-build:
    # Svelte 5 SPA build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: ui
        run: npm ci
      - working-directory: ui
        run: npm run check
      - working-directory: ui
        run: npm test
      - working-directory: ui
        run: npm run build
  smoke:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-random-secret-0123456789abcdef0123456789
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      INITIAL_ADMIN_PASSWORD: "CI-seed-password-42!x"
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      REDIS_URL: "redis://:ci-redis-password@redis:6379"
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - name: start postgres and redis
        run: docker compose up -d postgres redis
      - name: wait and inspect
        run: |
          sleep 8
          docker compose ps
      - name: healthz smoke (best effort)
        run: |
          set -o pipefail
          # App health endpoints only answer when the full stack is up;
          # curl failures here are reported but do not fail the job until
          # the stack is started in CI (audit M-18, best effort).
          for url in http://127.0.0.1:8000/healthz http://127.0.0.1:3000/healthz; do
            if curl -fsS --max-time 5 "$url" 2>/dev/null; then
              echo "OK: $url"
            else
              echo "WARN: $url unreachable (full stack not started in smoke; postgres/redis only)"
            fi
          done
      - run: docker compose logs --tail=50
      - run: docker compose down -v || true

# SynthMail Dovecot baseline
protocols = imap pop3 lmtp sieve
listen = *
# Mail stored in each user's home (from userdb) as a Maildir. The old
# autodetection needs a pre-created dir, which failed for fresh users.
mail_location = maildir:~
# Fail-closed TLS (audit C-06): Dovecot refuses to start without a cert.
ssl = yes
ssl_cert = </etc/letsencrypt/live/mail.example.com/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.example.com/privkey.pem
ssl = required
auth_mechanisms = plain login
auth_verbose = yes
# File logging (no syslog daemon in containers); fail2ban tails this.
log_path = /var/log/dovecot.log
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
service auth {
  # Postfix smtpd connects to this socket over the shared postfix-spool volume.
  # No user/group ownership needed: mode 0666 suffices (postfix uid differs per image).
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
  }
  user = vmail
}
service lmtp {
  # Postfix delivers via TCP LMTP (compose network), not the unix socket.
  inet_listener lmtp {
    port = 24
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
# Sieve: path lives inside the sieve setting in 2.3; managed via ManageSieve (port 4190)
plugin {
  sieve = file:~/sieve/active
}
# Quota: per-user limit comes from the userdb query (storage=<quota_mb>M)

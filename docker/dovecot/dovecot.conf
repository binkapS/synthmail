# SynthMail Dovecot baseline
protocols = imap pop3 lmtp sieve
listen = *
ssl = yes
ssl_cert = </etc/letsencrypt/live/mail.example.com/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.example.com/privkey.pem
ssl_dh = </etc/dovecot/dh-parameters.pem
auth_mech = plain login
auth_sql = yes
auth_verbose = yes
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service imap-login {
  inet_service imap {
    port = 143
  }
  inet_service imaps {
    port = 993
    ssl = yes
  }
}
service managesieve-login {
  inet_service sieve {
    port = 4190
  }
}
# Sieve
plugin = sieve
sieve = file:~/.dovecot/sieve/active.sieve
sieve_dir = ~/.dovecot/sieve/
# Quota
quota_rule = *:storage=1G
quota_rule2 = *:messages=10000
quota = dict:user::proxy::quota
quota_usage_service = unix:quota-status
service quota-status {
  # sockets for postfix
}
# LMTP port 24
service lmtp {
  inet_service lmtp {
    port = 24
  }
}

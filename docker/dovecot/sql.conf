# Dovecot SQL driver — queries Postgres (DB URL via env at runtime)
driver = pgsql
connect = host=postgres dbname=synthmail user=synth password=${POSTGRES_PASSWORD} port=5432

# password lookup — Argon2id hash stored in users.password_hash (dovecot supports {argon2id})
pass_query = SELECT email AS user, password_hash AS password, concat('*:storage=', quota_mb, 'M') AS user_attributes FROM users WHERE email = '%u' AND active = true

# user lookup
user_query = SELECT '/var/vmail/%d/%n' AS home, '%u@%d' AS user, '%u@%d' AS email, 5000 AS uid, 5000 AS gid, quota_mb AS quota FROM users WHERE email = '%u' AND active = true

[Definition]
# Plan §2: webmail rate-limiting / banning is enforced in-app
# (synth-common rate_limit + login_attempts table). This filter is kept as
# source input for the host-native or stdout-log scenario where webmail log
# lines are shipped to a file. The in-app path remains the primary control.
failregex = ^.*<HOST>.*401.*$
            ^.*<HOST>.*login.*fail.*$
ignoreregex =

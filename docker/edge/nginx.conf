events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr;
    include /etc/nginx/mime.types;
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            proxy_pass http://synth-watchdog:8081;
        }
        location /api/ {
            proxy_pass http://synth-control:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /mail/ {
            proxy_pass http://synth-webmail:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /jmap { proxy_pass http://synth-webmail:3000; }
        location /jmap/ { proxy_pass http://synth-webmail:3000; }
        location /dav/ { proxy_pass http://synth-webmail:3000; }
        location /.well-known/carddav { proxy_pass http://synth-webmail:3000; }
        location /.well-known/caldav { proxy_pass http://synth-webmail:3000; }
        location /admin/ {
            proxy_pass http://synth-webmail:3000;
            # IP allowlist for /admin in Phase 2 prod: allow 127.0.0.0/8 + VPN range
            # allow 10.0.0.0/8;
            # deny all;
        }
        location / {
            proxy_pass http://synth-webmail:3000;
        }
        location /health { return 200 "ok"; }
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/mail.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location /api/ { proxy_pass http://synth-control:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /jmap { proxy_pass http://synth-webmail:3000; }
        location /dav/ { proxy_pass http://synth-webmail:3000; }
        location / { proxy_pass http://synth-webmail:3000; proxy_set_header Host $host; }
    }
}

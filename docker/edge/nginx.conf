events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr;
    include /etc/nginx/mime.types;
    # The stock /etc/nginx/conf.d/default.conf is intentionally NOT included: it
    # would otherwise claim the default server name and shadow /health (and the
    # rest of this vhost). Edge uses this file as its complete configuration.
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        location /.well-known/acme-challenge/ {
            proxy_pass http://synth-watchdog:8081;
        }
        location /api/v1/mail/ {
            proxy_pass http://synth-webmail:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/ {
            proxy_pass http://synth-control:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /mail/ {
            proxy_pass http://synth-webmail:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /jmap { proxy_pass http://synth-webmail:3000; }
        location /jmap/ { proxy_pass http://synth-webmail:3000; }
        location /dav/ { proxy_pass http://synth-webmail:3000; }
        location /.well-known/carddav { proxy_pass http://synth-webmail:3000; }
        location /.well-known/caldav { proxy_pass http://synth-webmail:3000; }
        location /admin/ {
            # Built UI (Leptos SPA) — served by the synth-ui container.
            proxy_pass http://synth-ui:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /assets/ {
            # Leptos/WASM build artifacts from synth-ui.
            proxy_pass http://synth-ui:80;
        }
        location / {
            proxy_pass http://synth-webmail:3000;
        }
        location /health { return 200 "ok"; }
    }
    # HTTPS server lives in docker/edge/443.conf.example and is only
    # activated by the compose command when Let's Encrypt certs exist,
    # otherwise nginx aborts at startup on the missing ssl_certificate.
}

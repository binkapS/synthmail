# ClamAV antivirus (audit H-13).
# The clamav module takes `servers`, not `clamav_sock` (that key was from
# clamav-milter, not rspamd). clamd listens on 3310 in its container.
clamav {
  type = "clamav";
  symbol = "CLAM_VIRUS";
  servers = "clamav:3310";
  action = "reject";
  message = "${SCANNER}: virus found: ${VIRUS}";
  log_clean = true;
  scan_mime_parts = true;
}

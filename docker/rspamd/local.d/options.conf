# Rspamd local overrides (audit H-13).
# Rspamd auto-wraps each local.d/<name>.conf into the section <name>, so
# these files contain bare options only (no wrapping section braces).
# See https://docs.rspamd.com/configuration/redis/ and the antivirus module docs.
pidfile = "/var/run/rspamd.pid";
logging {
  type = "file";
  file = "/var/log/rspamd.log";
}

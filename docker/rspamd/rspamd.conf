# Rspamd — SynthMail baseline (spam, DNSBL, Bayes, DKIM/DMARC via opendkim opendmarc)
options {
    pidfile = "/var/run/rspamd.pid";
    dns {
        timeout = 5s;
    }
    logging {
        type = file;
        file = "/var/log/rspamd.log";
    }
}
modules {
    include "modules.d"
}
actions {
    reject_no_match = false;
}
# clamav module points to clamav:3310
clamav {
    clamav_sock = "clamav:3310";
    action = "reject";
    symbol = "CLAM_VIRUS";
    message = "${prefix} Virus found";
    type = "stat";
    product = "clamav";
    log_clean = true;
    log_clean_on_virus = true;
    # on-demand via Rspamd
}
# DKIM check is done in-rspamd + opendkim signing on outbound
dkim {
    keys = "/etc/opendkim/keys";
    signature = "/etc/opendkim/keys/default.private";
    selector = "default";
    domain = "";
    allow_pubkey_mismatch = true;
    # domain specific keys in Phase 1 via synth-dkim sync
}
# Greylisting
greylist {
    default = true;
    sender_ip = true;
    sender_mail = true;
    sender_rcpt = true;
    # whitelist authenticated
}
# Bayes
bayes {
    backend = "redis";
    servers = "redis:6379";
}
# Fuzzy
fuzzy {
    backend = "redis";
    servers = "redis:6379";
}

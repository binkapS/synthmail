Syslog yes
LogWhy yes
On-DomainSignature yes
On-DKIMSign yes
On-DKIMVerify yes
On-Unsigned yes
On-VerificationFailure yes
Socket inet:8893@localhost
UserID opendmarc
PidFile /run/opendmarc/opendmarc.pid
Domain example.com
# Aggregate reports to DMARC mailbox
BaseDomain example.com
FixTrust yes
SPFmlFrom yes
AuthServices opendkim
IgnoreAuthenticatedClients yes

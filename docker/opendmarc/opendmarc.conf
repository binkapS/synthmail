# SynthMail opendmarc — DMARC evaluation milter
# Valid opendmarc options only; unknown options are fatal in opendmarc (exit 78).
Syslog                      no
Socket                      inet:8893@0.0.0.0
UserID                      opendmarc:opendmarc
PidFile                     /run/opendmarc/opendmarc.pid
# Must match the authserv-id used in DMARC report processing; per-domain
# override comes from policy records, this is only the default receiver id.
AuthservID                  mail.example.com
TrustedHosts                /etc/opendmarc/TrustedHosts
IgnoreAuthenticatedClients  true

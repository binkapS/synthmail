global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: synth-control
    static_configs:
      - targets: ["synth-control:8000"]
    metrics_path: /metrics
  - job_name: synth-webmail
    static_configs:
      - targets: ["synth-webmail:3000"]
    metrics_path: /metrics
  - job_name: synth-watchdog
    static_configs:
      - targets: ["synth-watchdog:8081"]
    metrics_path: /metrics
  # NOTE: the previous "postfix-queue" job scraped synth-watchdog a second
  # time and never measured the Postfix queue. Removed (audit M-21); queue
  # depth is a gauge (synth_control_postfix_queue) on the synth-control job.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: synth-control
    static_configs:
      - targets: ["synth-control:8000"]
    metrics_path: /metrics
  - job_name: synth-webmail
    static_configs:
      - targets: ["synth-webmail:3000"]
    metrics_path: /metrics
  - job_name: synth-watchdog
    static_configs:
      - targets: ["synth-watchdog:8081"]
    metrics_path: /metrics
  - job_name: postfix-queue
    static_configs:
      - targets: ["synth-watchdog:8081"]
    metrics_path: /metrics

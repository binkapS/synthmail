Syslog yes
LogWhy yes
On-Domain-Signature yes
DomainKeys yes
On-BehalfOf yes
On-DefaultSignature yes
On-DKIMSign yes
On-DKIMVerify yes
On-PreviousSignature yes
On-SignatureTooOld yes
On-Unsigned yes
On-VerificationFailureTransactional no
On-VerificationFailureDrop no
Mode s
Canonicalization relaxed/simple
MinimumKeyBits 1024
MaxSignatures 10
Socket inet:8892@localhost
TrustAnchorFile /usr/share/dns/root.key
TrustAnchorFile /usr/share/dns/dlv.isc.org.key
UserID opendkim
PidFile /run/opendkim/opendkim.pid
KeyTable /etc/opendkim/KeyTable
SigningTable /etc/opendkim/SigningTable
KeyFile /etc/opendkim/keys/default.private
Selector default
Domain example.com
SendmailRestart if required

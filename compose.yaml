# SynthMail — deployment compose file.
# Security notes (audit H-05): only the edge service (80/443) is published on
# all interfaces. Application (8000/3000) and monitoring (9090/3001/5232)
# ports are bound to 127.0.0.1 only — reach them via the edge reverse proxy
# or an SSH tunnel/VPN. The watchdog service publishes no host port; query
# its health endpoint from inside the mailnet network.
services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/edge/443.conf.example:/etc/nginx/443.conf.example:ro
      - certs:/etc/letsencrypt
    depends_on: [synth-control, synth-webmail]
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  postfix:
    build:
      context: ./docker/postfix
      dockerfile: Dockerfile
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    # TLS (audit C-06): certs must exist under certs/live/<MAIL_HOST>/ before
    # postfix starts. Provision them with the acme profile or copy manually;
    # the container fails closed otherwise (smtpd_tls_cert_file missing).
    volumes:
      - postfix-spool:/var/spool/postfix
      - logs:/var/log
      - maildir:/var/vmail
      - certs:/etc/letsencrypt
      - ./docker/postfix/main.cf:/etc/postfix/main.cf:ro
      - ./docker/postfix/master.cf:/etc/postfix/master.cf:ro
    environment:
      # Used by the entrypoint to substitute the password into the pgsql maps
      # under docker/postfix/pgsql/*.cf (audit H-06).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on: [postgres, redis]
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  dovecot:
    build:
      context: ./docker/dovecot
      dockerfile: Dockerfile
    # Loopback-only (audit N-05): plaintext IMAP/POP3 on 143/110 carry
    # credentials, and TLS is fail-closed. Expose via a TLS terminator
    # (edge) or an SSH tunnel. Publish 993/995/4190 only after ACME.
    ports:
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
      - "127.0.0.1:4190:4190"
    volumes:
      - maildir:/var/vmail
      - logs:/var/log
      - certs:/etc/letsencrypt
      - postfix-spool:/var/spool/postfix
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synth_dev}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    restart: unless-stopped

  rspamd:
    # Config split into local.d/<module>.conf snippets (audit H-13);
    # local.d/redis.conf uses ${REDIS_PASSWORD} via UCL env expansion.
    # Pinned (audit M-16); bump deliberately with a config test.
    image: rspamd/rspamd:3.6.0
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - rspamd:/var/lib/rspamd
      - ./docker/rspamd/local.d:/etc/rspamd/local.d:ro
    depends_on: [clamav, redis]
    networks: [mailnet]
    healthcheck:
      # GET (not HEAD): rspamd /ping rejects HEAD, which --spider sends.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:11334/ping || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable-debian # pinned by release channel (audit M-16 note)
    # NOTE: clamav publishes only stable-debian / unstable — no numeric tag.
    # Pin by digest in production once a digest is known.
    volumes:
      - clamav:/var/lib/clamav
    networks: [mailnet]
    healthcheck:
      # TCP probe on clamd's control port; clamdscan --ping is unreliable
      # inside this image's socket layout.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3310' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  freshclam:
    image: clamav/clamav:stable-debian # see clamav pin note above
    command: ["freshclam", "-d", "--foreground"]
    volumes:
      - clamav:/var/lib/clamav
    networks: [mailnet]
    # Image's built-in HEALTHCHECK tests clamd, which never runs here;
    # override with a process liveness probe.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'freshclam -d' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  opendkim:
    build:
      context: ./docker/opendkim
      dockerfile: Dockerfile
    volumes:
      - dkim:/etc/opendkim/keys
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "opendkim", "-V"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  opendmarc:
    build:
      context: ./docker/opendmarc
      dockerfile: Dockerfile
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "opendmarc-check"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-control:
    build:
      context: .
      dockerfile: docker/synth-control/Dockerfile
    ports:
      # Loopback-only (audit H-05). Expose publicly via the edge service.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Fail fast if unset (audit C-05) — no dev-secret fallback.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      # Encryption key for DKIM/TOTP secrets at rest (audit M-15/H-07);
      # 64 hex chars (32 bytes). Fail fast — keys are never auto-generated.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (64 hex chars)}
      # Forwarded so first-boot admin seeding uses operator values (audit C-05).
      # Leave empty to have a random one-time password generated instead.
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@example.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - MAIL_HOST=${MAIL_HOST:-mail.example.com}
    volumes:
      # Shared with opendkim so newly generated keys are signed immediately (audit H-07).
      - dkim:/var/dkim-sync
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-webmail:
    build:
      context: .
      dockerfile: docker/synth-webmail/Dockerfile
    ports:
      # Loopback-only (audit H-05). Expose publicly via the edge service.
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (64 hex chars)}
      - MAILDIR_DIR=/var/vmail
      - SMTP_HOST=postfix
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      dovecot: { condition: service_healthy }
    volumes:
      - maildir:/var/vmail
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-watchdog:
    build:
      context: .
      dockerfile: docker/synth-watchdog/Dockerfile
    # No host ports: watchdog is only reachable inside the mailnet network
    # (audit H-05 — previously exposed neither port nor loopback binding;
    # leaving it network-internal is the minimal safe default).
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on: [postgres, redis]
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 60s
      timeout: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-synth}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synth_dev}
      - POSTGRES_DB=${POSTGRES_DB:-synthmail}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synth"]
      interval: 10s
      timeout: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Enable authentication (audit H-08). REDIS_URL passed to the apps must
    # include this same password, e.g.
    #   REDIS_URL=redis://:CHANGE_ME_REDIS@redis:6379
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis:/data
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: unless-stopped

  fail2ban:
    build:
      context: ./docker/fail2ban
      dockerfile: Dockerfile
    volumes:
      - logs:/var/log
    depends_on: [postfix, dovecot]
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "fail2ban-client", "status"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  radicale:
    image: kozea/radicale:3
    profiles: ["dav"]
    volumes:
      - radicale_data:/data
      - ./docker/radicale/config:/config:ro
    ports:
      - "127.0.0.1:5232:5232"
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5232/"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2
    profiles: ["monitoring"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [mailnet]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - ./docker/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-ui:
    build:
      context: .
      dockerfile: docker/synth-ui/Dockerfile
    ports:
      # Loopback-only (audit H-11). Expose via edge /admin/.
      - "127.0.0.1:3002:80"
    networks: [mailnet, edge]

  backup:
    # Full tooling (audit H-09): pg_dump + tar + sha256 + retention + rclone.
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    profiles: ["backup"]
    volumes:
      - backups:/backups
      - maildir:/var/vmail:ro
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - PGUSER=${POSTGRES_USER:-synth}
      - PGDB=${POSTGRES_DB:-synthmail}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [mailnet]

  backup-restore-test:
    # One-shot restore dry-run: checksums + pg_restore --list + tar list.
    # Dry-run by default (RESTORE_EXECUTE unset). Run with:
    #   docker compose --profile backup-test run --rm backup-restore-test
    # To really restore, set RESTORE_EXECUTE=true and a spare target.
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    profiles: ["backup-test"]
    entrypoint: ["/usr/local/bin/restore.sh"]
    command: ["--dry-run"]
    volumes:
      - backups:/backups:ro
    environment:
      - BACKUP_DIR=/backups
      - RESTORE_DIR=/restore
      - RESTORE_EXECUTE=${RESTORE_EXECUTE:-false}
      - PGPASSWORD=${POSTGRES_PASSWORD:-}
      - PGUSER=${POSTGRES_USER:-synth}
      - PGDB=${POSTGRES_DB:-synthmail}
    networks: [mailnet]

  acme:
    # Let's Encrypt HTTP-01 challenges served by synth-watchdog :8081
    # (audit C-06). Run: docker compose --profile acme run --rm acme
    image: certbot/certbot:v4.0.0
    profiles: ["acme"]
    environment:
      - MAIL_HOST=${MAIL_HOST:?MAIL_HOST must be set}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}
    volumes:
      - certs:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - >-
        certbot certonly --webroot -w /etc/letsencrypt/acme-challenge
        -d $${MAIL_HOST}
        --email $${LETSENCRYPT_EMAIL} --agree-tos --non-interactive
        --staging
        && echo 'ACME complete — re-run without --staging for production certs'

volumes:
  maildir:
  postfix-spool:
  logs:
  postgres:
  redis:
  rspamd:
  clamav:
  dkim:
  certs:
  backups:
  prometheus_data:
  radicale_data:

networks:
  mailnet:
    driver: bridge
  edge:
    driver: bridge

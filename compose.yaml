# SynthMail — deployment compose file.
# Security notes (audit H-05): only the edge service (80/443) is published on
# all interfaces. Application (8000/3000) and monitoring (9090/3001/5232)
# ports are bound to 127.0.0.1 only — reach them via the edge reverse proxy
# or an SSH tunnel/VPN. The watchdog service publishes no host port; query
# its health endpoint from inside the mailnet network.
#
# Plan §1 (preserve real SMTP client IPs): the four public-facing mail daemons
# (postfix / dovecot / rspamd / clamav) run on the `mailnet` bridge by
# default, so inbound SMTP shows the bridge gateway IP as `client=`, not the
# public sender. To put them on the host network instead (so Postfix's
# `client=` logs and Rspamd/RBL lookups see the real public IP), set:
#   export MAIL_EDGE=1
# and reload. In host mode:
#   - `network_mode: host` replaces `networks: [mailnet]` on the four daemons;
#   - the bridge NAT publishing of 25/465/587/993/4190 is cleared (the
#     daemons bind host ports directly, so re-publishing would collide);
#   - the shared volumes (maildir, certs, postfix-spool, dkim) are unchanged;
#   - the Postfix entrypoint tightens `mynetworks` to loopback-only because
#     the bridge subnet is no longer a trusted peer address space.
# The host firewall must then allow 25/465/587/993/4190 on the host. The
# default (bridge) layout keeps the existing `127.0.0.1`-bound ports and is
# unchanged. See docs/runbooks/deliverability.md "Host-network edge
# validation" for the acceptance test that records `client=` log evidence.
services:
  edge:
    image: nginx:1.27-alpine
    # Mailcow-style: bind host port is configurable so SynthMail can sit behind
    # an existing reverse proxy / another web server on 80/443. Defaults are
    # off the well-known HTTP/HTTPS ports to avoid collisions (e.g. with a
    # system Apache or a host-level reverse proxy).
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/edge/443.conf.example:/etc/nginx/443.conf.example:ro
      - certs:/etc/letsencrypt
    depends_on: [synth-control, synth-webmail]
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  postfix:
    build:
      context: ./docker/postfix
      dockerfile: Dockerfile
    # Plan §1 (preserve real SMTP client IPs).
    #
    # Bridge layout (default, MAIL_EDGE_NETWORK unset):
    #   networks: [mailnet], ports 25/465/587 published via bridge NAT.
    # Inbound SMTP shows the bridge gateway as client=; acceptable for dev.
    #
    # Host layout (MAIL_EDGE_NETWORK=host in .env):
    #   network_mode: host — the daemon binds host ports 25/465/587 directly,
    #   so inbound client= is the public remote IP, not a bridge address.
    #   No bridge NAT publishing is used; the host firewall must allow
    #   25/465/587 inbound. Shared volumes (maildir, certs, postfix-spool,
    #   logs, dkim) are unchanged.
    #
    # In host mode the Postfix entrypoint tightens mynetworks to loopback
    # only (the bridge subnet 172.17.0.0/16 is no longer the trusted peer
    # address space). Set via the MAIL_EDGE env var below.
    # Plan §1: host network by default so Postfix/Dovecot/Rspamd see the real
    # remote sender IP (client=) rather than the Docker bridge gateway.
    # Set MAIL_EDGE_NETWORK="" to fall back to bridge NAT (no public IP
    # preservation; only usable when the stack sits behind a port-forwarding
    # NAT and you do NOT need the public source IP in Postfix logs).
    #
    # In host mode the daemon binds host ports directly, so we do NOT publish
    # bridge NAT ports for 25/465/587 — doing so would collide with the
    # host-binds. Host firewall (nft/iptables) must allow 25/465/587/993/4190.
    network_mode: ${MAIL_EDGE_NETWORK:-host}
    # No port publishing in host mode (bridge NAT would collide with the
    # direct host binds). When running the bridge fallback (MAIL_EDGE_NETWORK=""
    # plus `networks: [mailnet]` re-added by hand), restore the publishes.
    # ports:
    #   - "25:25"
    #   - "465:465"
    #   - "587:587"
    # TLS (audit C-06): certs must exist under certs/live/<MAIL_HOST>/ before
    # postfix starts. Provision them with the acme profile or copy manually;
    # the container fails closed otherwise (smtpd_tls_cert_file missing).
    volumes:
      - postfix-spool:/var/spool/postfix
      - logs:/var/log
      - maildir:/var/vmail
      - certs:/etc/letsencrypt
      - ./docker/postfix/main.cf:/etc/postfix/main.cf:ro
      - ./docker/postfix/master.cf:/etc/postfix/master.cf:ro
    environment:
      # Used by the entrypoint to substitute the password into the pgsql maps
      # under docker/postfix/pgsql/*.cf (audit H-06).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Plan §1: the entrypoint reads MAIL_EDGE=1 to tighten mynetworks to
      # loopback-only (host-network layout; the bridge subnet is no longer a
      # trusted peer address space). Always "1" in the default host layout.
      - MAIL_EDGE=${MAIL_EDGE:-1}
    depends_on: [postgres, redis]
    # Plan §1: in host-network mode we must NOT also attach to a user-defined
    # bridge network (network_mode: host is mutually exclusive with `networks`).
    # The daemon reaches postgres/redis by service hostname over the host's
    # DNS (the bridge network's DNS is still attached to the app services), so
    # the pgsql virtual maps and LMTP delivery still resolve.
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  dovecot:
    build:
      context: ./docker/dovecot
      dockerfile: Dockerfile
    # Plan §1: host network so IMAP/POP3 clients connect with their real
    # public IP. The dovecot daemon binds host ports 143/993/110/995/4190
    # directly; no bridge NAT publishing. Loopback-only publishing was the
    # pre-plan behaviour (audit N-05); in host mode the host firewall
    # (nft/iptables) + fail2ban are the enforcement points.
    network_mode: ${MAIL_EDGE_NETWORK:-host}
    # No bridge port publishing in host mode (would collide with host binds).
    # ports:
    #   - "127.0.0.1:143:143"
    #   - "127.0.0.1:993:993"
    #   - "127.0.0.1:110:110"
    #   - "127.0.0.1:995:995"
    #   - "127.0.0.1:4190:4190"
    volumes:
      - maildir:/var/vmail
      - logs:/var/log
      - certs:/etc/letsencrypt
      - postfix-spool:/var/spool/postfix
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synth_dev}
      # Plan §1: host-network edge flag.
      - MAIL_EDGE=${MAIL_EDGE:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    restart: unless-stopped

  rspamd:
    # Config split into local.d/<module>.conf snippets (audit H-13).
    # redis.conf is generated at startup from $REDIS_PASSWORD because the
    # image's entrypoint does no Jinja templating and rspamd does not import
    # environment variables into UCL (verified: NOAUTH without this).
    # user 0: the generation step needs root (local.d bind-mount is owned
    # by the host, not UID 11333); rspamd workers drop privileges internally.
    # The generation step runs as root, then rspamd itself drops to its
    # unprivileged 11333 user (rspamd refuses to run workers as root).
    image: rspamd/rspamd:3.6.0
    user: "0:0"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - /bin/sh
      - -c
      - |
        printf 'servers = "redis:6379";\npassword = "%s";\ntimeout = 1s;\n' "$$REDIS_PASSWORD" \
          > /etc/rspamd/local.d/redis.conf
        exec /usr/bin/setpriv --reuid=11333 --regid=11333 --clear-groups /usr/bin/rspamd -f
    volumes:
      - rspamd:/var/lib/rspamd
      - ./docker/rspamd/local.d:/etc/rspamd/local.d
    depends_on: [clamav, redis]
    # Plan §1: host network so Rspamd DNSBL/RBL checks receive the original
    # client IP (not the Docker bridge gateway). Rspamd binds 11334 directly
    # on the host; no bridge NAT publishing.
    network_mode: ${MAIL_EDGE_NETWORK:-host}
    healthcheck:
      # GET (not HEAD): rspamd /ping rejects HEAD, which --spider sends.
      # No wget in the rspamd image: bash dev/tcp probe instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11334' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable-debian # pinned by release channel (audit M-16 note)
    # NOTE: clamav publishes only stable-debian / unstable — no numeric tag.
    # Pin by digest in production once a digest is known.
    volumes:
      - clamav:/var/lib/clamav
    # Plan §1: host network (clamd binds host port 3310 directly; no bridge
    # NAT publishing). Part of the host-networked mail-edge profile.
    network_mode: ${MAIL_EDGE_NETWORK:-host}
    healthcheck:
      # TCP probe on clamd's control port; clamdscan --ping is unreliable
      # inside this image's socket layout.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3310' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  freshclam:
    image: clamav/clamav:stable-debian # see clamav pin note above
    command: ["freshclam", "-d", "--foreground"]
    volumes:
      - clamav:/var/lib/clamav
    networks: [mailnet]
    # Image's built-in HEALTHCHECK tests clamd, which never runs here;
    # override with a /proc-based liveness probe (no pgrep/ps in image).
    healthcheck:
      test: ["CMD-SHELL", "for p in /proc/[0-9]*/comm; do grep -q freshclam \"$$p\" 2>/dev/null && exit 0; done; exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  opendkim:
    build:
      context: ./docker/opendkim
      dockerfile: Dockerfile
    volumes:
      - dkim:/etc/opendkim/keys
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "opendkim", "-V"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  opendmarc:
    build:
      context: ./docker/opendmarc
      dockerfile: Dockerfile
    networks: [mailnet]
    # Healthcheck comes from the Dockerfile (TCP probe on 8893); the old
    # `opendmarc-check` compose probe failed in this image.
    restart: unless-stopped

  synth-control:
    build:
      context: .
      dockerfile: docker/synth-control/Dockerfile
    ports:
      # Loopback-only (audit H-05). Expose publicly via the edge service.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Fail fast if unset (audit C-05) — no dev-secret fallback.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      # Encryption key for DKIM/TOTP secrets at rest (audit M-15/H-07);
      # 64 hex chars (32 bytes). Fail fast — keys are never auto-generated.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (64 hex chars)}
      # Forwarded so first-boot admin seeding uses operator values (audit C-05).
      # Leave empty to have a random one-time password generated instead.
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@example.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - MAIL_HOST=${MAIL_HOST:-mail.example.com}
      # Plan §3: opt-in flag for the admin container-stats view. Default is
      # OFF; the Docker socket mount is commented out below. Set to "1" and
      # uncomment the socket volume when you want per-container status on a
      # trusted host.
      - ENABLE_CONTAINER_STATS=${ENABLE_CONTAINER_STATS:-0}
      # Where to find the Docker socket if ENABLE_CONTAINER_STATS=1.
      - DOCKER_SOCKET=${DOCKER_SOCKET:-/var/run/docker.sock}
    volumes:
      # Shared with opendkim so newly generated keys are signed immediately (audit H-07).
      - dkim:/var/dkim-sync
      # Plan §3: Docker socket access is OPTIONAL, not a required default.
      # The in-app container-stats view in the admin Server panel is gated
      # behind ENABLE_CONTAINER_STATS (see crates/synth-control/src/routes.rs);
      # without the flag the panel shows a clean "intentionally disabled"
      # note and the host-level CPU/RAM/disk metrics keep working.
      #
      # Mount the read-only socket ONLY on a trusted host where you want the
      # per-container view. It grants local control-plane access to Docker and
      # should not be enabled on untrusted or shared hosts. To enable:
      #   - enable the volume mount below (uncomment) and set
      #     ENABLE_CONTAINER_STATS=1 in .env
      # On untrusted hosts leave it commented; the admin panel then simply
      # omits the container section.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-webmail:
    build:
      context: .
      dockerfile: docker/synth-webmail/Dockerfile
    ports:
      # Loopback-only (audit H-05). Expose publicly via the edge service.
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (64 hex chars)}
      - MAILDIR_DIR=/var/vmail
      - SMTP_HOST=postfix
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      dovecot: { condition: service_healthy }
    volumes:
      - maildir:/var/vmail
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-watchdog:
    build:
      context: .
      dockerfile: docker/synth-watchdog/Dockerfile
    # No host ports: watchdog is only reachable inside the mailnet network
    # (audit H-05 — previously exposed neither port nor loopback binding;
    # leaving it network-internal is the minimal safe default).
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on: [postgres, redis]
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 60s
      timeout: 5s
    restart: unless-stopped

  synth-smtp:
    build:
      context: .
      dockerfile: docker/synth-smtp/Dockerfile
    # ESMTP submission service: STARTTLS + AUTH (SASL PLAIN/LOGIN),
    # Redis-backed queue, Postfix relay. Loopback-only publish
    # (audit H-05) — to expose publicly, connect it through a
    # deliberate firewall rule (the per-connection/auth rate limits are
    # Redis-shared, but network-level exposure is a separate decision).
    ports:
      - "127.0.0.1:2525:2525"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Fail fast if unset (audit C-05) — same policy as synth-control/webmail.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (64 hex chars)}
      - MAIL_HOST=${MAIL_HOST:-mail.example.com}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-example.com}
    volumes:
      # TLS material for STARTTLS mode (fail-closed when TLS flags are set
      # but files are missing). Mounted read-only; acme populates these.
      - certs:/etc/letsencrypt:ro
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "2525"
      - --redis-url
      - ${REDIS_URL:-redis://redis:6379}
      - --database-url
      - ${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - --server-name
      - ${MAIL_HOST:-mail.example.com}
      # TLS + AUTH: the listener only advertises STARTTLS/AUTH when the
      # operator passes --tls-cert/--tls-key (paths under
      # /etc/letsencrypt/live/${MAIL_HOST}/). Default is no-TLS
      # trusted-mailnet only (relay restricted to MAIL_DOMAIN, never an
      # open relay). To enable STARTTLS+AUTH, append e.g.:
      #   --tls-cert /etc/letsencrypt/live/$MAIL_HOST/fullchain.pem
      #   --tls-key /etc/letsencrypt/live/$MAIL_HOST/privkey.pem
      #   --require-auth
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailnet]
    extra_hosts:
      # Lets containerised relays reach a host-networked postfix
      # (MAIL_EDGE_NETWORK=host) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # SMTP has no HTTP /healthz: TCP-probe the 220 greeting (same
      # pattern as the synth-smtp Dockerfile HEALTHCHECK).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2525' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-synth}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synth_dev}
      - POSTGRES_DB=${POSTGRES_DB:-synthmail}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synth"]
      interval: 10s
      timeout: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Enable authentication (audit H-08). REDIS_URL passed to the apps must
    # include this same password, e.g.
    #   REDIS_URL=redis://:CHANGE_ME_REDIS@redis:6379
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis:/data
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: unless-stopped

  fail2ban:
    build:
      context: ./docker/fail2ban
      dockerfile: Dockerfile
    # Plan §2: make fail2ban effective on the host.
    #
    # network_mode: host → the ban action (nft/iptables in jail.local) reaches
    # the HOST firewall, not a per-container netns. Banned IPs are blocked
    # for host-level SMTP/IMAP traffic.
    #
    # logs: the `logs` named volume (shared with postfix + dovecot) holds
    # /var/log/postfix.log and /var/log/dovecot.log. Mount the host's
    # /var/log read-only instead if you run fail2ban host-native and want it
    # to tail journald/syslog-collected Postfix/Dovecot logs at the same
    # location. See docs/runbooks/security.md "fail2ban host enforcement".
    volumes:
      - logs:/var/log
      # Host /var/log read-only option for host-native enforcement
      # (adjust jail.local logpath to match; unmount the `logs` volume then).
      # - /var/log:/host-var-log:ro
    depends_on: [postfix, dovecot]
    # Plan §2: host network so bans apply at the host firewall, not inside a
    # container namespace. The host firewall (nftables/iptables) is the
    # enforcement point; verify with `docker compose exec fail2ban
    # fail2ban-client status` and that the host firewall shows the ban.
    network_mode: host
    # Minimum capability for the host firewall ban action (nft/iptables).
    # Scoped to the container; no SYS_ADMIN or other broad capability.
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "fail2ban-client", "status"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  radicale:
    image: kozea/radicale:3
    profiles: ["dav"]
    volumes:
      - radicale_data:/data
      - ./docker/radicale/config:/config:ro
    ports:
      - "127.0.0.1:5232:5232"
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5232/"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2
    profiles: ["monitoring"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [mailnet]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - ./docker/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-ui:
    build:
      context: .
      dockerfile: docker/synth-ui/Dockerfile
    ports:
      # Loopback-only (audit H-11). Expose via edge /admin/.
      - "127.0.0.1:3002:80"
    networks: [mailnet, edge]

  backup:
    # Full tooling (audit H-09): pg_dump + tar + sha256 + retention + rclone.
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    profiles: ["backup"]
    volumes:
      - backups:/backups
      - maildir:/var/vmail:ro
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - PGUSER=${POSTGRES_USER:-synth}
      - PGDB=${POSTGRES_DB:-synthmail}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [mailnet]

  backup-restore-test:
    # One-shot restore dry-run: checksums + pg_restore --list + tar list.
    # Dry-run by default (RESTORE_EXECUTE unset). Run with:
    #   docker compose --profile backup-test run --rm backup-restore-test
    # To really restore, set RESTORE_EXECUTE=true and a spare target.
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    profiles: ["backup-test"]
    entrypoint: ["/usr/local/bin/restore.sh"]
    command: ["--dry-run"]
    volumes:
      - backups:/backups:ro
    environment:
      - BACKUP_DIR=/backups
      - RESTORE_DIR=/restore
      - RESTORE_EXECUTE=${RESTORE_EXECUTE:-false}
      - PGPASSWORD=${POSTGRES_PASSWORD:-}
      - PGUSER=${POSTGRES_USER:-synth}
      - PGDB=${POSTGRES_DB:-synthmail}
    networks: [mailnet]

  acme:
    # Let's Encrypt HTTP-01 challenges served by synth-watchdog :8081
    # (audit C-06). Run: docker compose --profile acme run --rm acme
    #
    # ACME_STAGE selects certbot's environment (Plan §4): "staging" tests the
    # renewal pipeline against Let's Encrypt's staging CA (safe, no rate
    # limit on the production CA), "prod" issues a real certificate.
    # Default is prod — run staging first, confirm renewal works, then switch
    # to prod for cutover.
    image: certbot/certbot:v4.0.0
    profiles: ["acme"]
    environment:
      - MAIL_HOST=${MAIL_HOST:?MAIL_HOST must be set}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}
      - ACME_STAGE=${ACME_STAGE:-prod}
    volumes:
      - certs:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - >-
        STAGE=""; [ "$$ACME_STAGE" = "staging" ] && STAGE="--staging";
        certbot certonly --webroot -w /etc/letsencrypt/acme-challenge
        -d $${MAIL_HOST}
        --email $${LETSENCRYPT_EMAIL} --agree-tos --non-interactive $$STAGE
        && echo "ACME complete ($${ACME_STAGE} cert issued for $${MAIL_HOST})"

volumes:
  maildir:
  postfix-spool:
  logs:
  postgres:
  redis:
  rspamd:
  clamav:
  dkim:
  certs:
  backups:
  prometheus_data:
  radicale_data:

networks:
  mailnet:
    driver: bridge
  edge:
    driver: bridge

services:
  edge:
    image: nginx:alpine
    command:
      - /bin/sh
      - -c
      - rm -f /etc/nginx/conf.d/default.conf;
        if [ -f /etc/letsencrypt/live/mail.example.com/fullchain.pem ]; then
        cp /etc/nginx/443.conf.example /etc/nginx/conf.d/443.conf;
        else rm -f /etc/nginx/conf.d/443.conf; fi;
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/edge/443.conf.example:/etc/nginx/443.conf.example:ro
      - certs:/etc/letsencrypt
    depends_on: [synth-control, synth-webmail]
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  postfix:
    build:
      context: ./docker/postfix
      dockerfile: Dockerfile
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    volumes:
      - postfix-spool:/var/spool/postfix
      - logs:/var/log
      - maildir:/var/vmail
      - certs:/etc/letsencrypt
      - ./docker/postfix/main.cf:/etc/postfix/main.cf:ro
      - ./docker/postfix/master.cf:/etc/postfix/master.cf:ro
    depends_on: [postgres, redis]
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  dovecot:
    build:
      context: ./docker/dovecot
      dockerfile: Dockerfile
    ports:
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
    volumes:
      - maildir:/var/vmail
      - logs:/var/log
      - certs:/etc/letsencrypt
      - postfix-spool:/var/spool/postfix
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synth_dev}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    restart: unless-stopped

  rspamd:
    image: rspamd/rspamd:latest
    volumes:
      - rspamd:/var/lib/rspamd
      - ./docker/rspamd/rspamd.conf:/etc/rspamd/local.d/rspamd.conf:ro
    depends_on: [clamav, redis]
    networks: [mailnet]
    healthcheck:
      # GET (not HEAD): rspamd /ping rejects HEAD, which --spider sends.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:11334/ping || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable-debian
    volumes:
      - clamav:/var/lib/clamav
    networks: [mailnet]
    healthcheck:
      # TCP probe on clamd's control port; clamdscan --ping is unreliable
      # inside this image's socket layout.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3310' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  freshclam:
    image: clamav/clamav:stable-debian
    command: ["freshclam", "-d", "--foreground"]
    volumes:
      - clamav:/var/lib/clamav
    networks: [mailnet]
    # Image's built-in HEALTHCHECK tests clamd, which never runs here;
    # override with a process liveness probe.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'freshclam -d' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  opendkim:
    build:
      context: ./docker/opendkim
      dockerfile: Dockerfile
    volumes:
      - dkim:/etc/opendkim/keys
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "opendkim", "-V"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  opendmarc:
    build:
      context: ./docker/opendmarc
      dockerfile: Dockerfile
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "opendmarc-check"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-control:
    build:
      context: .
      dockerfile: docker/synth-control/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me-32bytes-min-0000}
      - MAIL_HOST=${MAIL_HOST:-mail.example.com}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-webmail:
    build:
      context: .
      dockerfile: docker/synth-webmail/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me-32bytes-min-0000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      dovecot: { condition: service_healthy }
    networks: [mailnet, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  synth-watchdog:
    build:
      context: .
      dockerfile: docker/synth-watchdog/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://synth:synth_dev@postgres:5432/synthmail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on: [postgres, redis]
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 60s
      timeout: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-synth}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synth_dev}
      - POSTGRES_DB=${POSTGRES_DB:-synthmail}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synth"]
      interval: 10s
      timeout: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    restart: unless-stopped

  fail2ban:
    build:
      context: ./docker/fail2ban
      dockerfile: Dockerfile
    volumes:
      - logs:/var/log
    depends_on: [postfix, dovecot]
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "fail2ban-client", "status"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  radicale:
    image: kozea/radicale:latest
    profiles: ["dav"]
    volumes:
      - radicale_data:/data
      - ./docker/radicale/config:/config:ro
    ports:
      - "5232:5232"
    networks: [mailnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5232/"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [mailnet]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [mailnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  backup:
    image: rclone/rclone
    profiles: ["backup"]
    volumes:
      - backups:/backups
    networks: [mailnet]
    entrypoint: ["sh", "-c", "pg_dump -Fc -h postgres -U synth synthmail > /backups/db-$$(date +%F).dump && tar -czf /backups/maildir-$$(date +%F).tar.gz /var/vmail && rclone sync /backups $${RCLONE_REMOTE:-''} 2>/dev/null || echo 'no remote configured'"]

volumes:
  maildir:
  postfix-spool:
  logs:
  postgres:
  redis:
  rspamd:
  clamav:
  dkim:
  certs:
  backups:
  prometheus_data:
  radicale_data:

networks:
  mailnet:
    driver: bridge
  edge:
    driver: bridge

[workspace]
resolver = "2"
members = [
    "crates/synth-common",
    "crates/synth-control",
    "crates/synth-webmail",
    "crates/synth-watchdog",
    "crates/synth-filter",
    "crates/synth-dkim",
    "crates/synth-migrate",
    "crates/synth-ui",
    "crates/synth-smtp",
    "crates/synth-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["SynthMail Team"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
axum = "0.8"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "tls-rustls-ring", "uuid", "chrono", "migrate"] }
redis = { version = "0.28", features = ["aio", "tokio-comp"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prometheus-client = "0.23"
clap = { version = "4", features = ["derive"] }
config = "0.15"
async-imap = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
hmac = "0.12"
sha1 = "0.10"
